<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Access</title>

<style>
  body {
    font-family: Arial;
    background: #f4f4f4;
    text-align: center;
    margin-top: 100px;
  }

  .box {
    background: white;
    padding: 30px;
    width: 320px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  input {
    padding: 10px;
    width: 90%;
    margin-top: 10px;
    font-size: 16px;
  }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    background: #007BFF;
    color: white;
    border: none;
    cursor: pointer;
  }

  button:hover {
    background: #0056b3;
  }

  .error {
    color: red;
    margin-top: 10px;
  }

  .success {
    color: green;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="box">
  <h2>Enter Student ID</h2>

  <input type="text" id="studentId" placeholder="Enter 6-digit ID" maxlength="6">

  <button onclick="submitData()">Submit</button>

  <p class="error" id="errorMsg"></p>
</div>

<script>
// Key prefix for localStorage
const STORAGE_PREFIX = "student_submit_";

function getLastSubmitTime(studentId) {
  const key = STORAGE_PREFIX + studentId;
  const stored = localStorage.getItem(key);
  if (!stored) return null;
  return parseInt(stored, 10); // timestamp in milliseconds
}

function setLastSubmitTime(studentId) {
  const key = STORAGE_PREFIX + studentId;
  localStorage.setItem(key, Date.now());
}

function isWithin24Hours(lastTime) {
  if (!lastTime) return false;
  const now = Date.now();
  const hoursDiff = (now - lastTime) / (1000 * 60 * 60);
  return hoursDiff < 24;
}

function submitData() {
  let id = document.getElementById("studentId").value.trim();
  let errorMsg = document.getElementById("errorMsg");

  // Validate 6-digit ID
  let pattern = /^[0-9]{6}$/;
  if (!pattern.test(id)) {
    errorMsg.innerText = "Enter a valid 6-digit ID";
    errorMsg.style.color = "red";
    return;
  }

  // Check 24-hour limit
  const lastSubmit = getLastSubmitTime(id);
  if (isWithin24Hours(lastSubmit)) {
    const hoursRemaining = 24 - ((Date.now() - lastSubmit) / (1000 * 60 * 60));
    const hoursInt = Math.ceil(hoursRemaining);
    errorMsg.innerText = `This ID has already been used recently. Please wait ${hoursInt} hour(s) before submitting again.`;
    errorMsg.style.color = "red";
    return;
  }

  errorMsg.innerText = "";
  
  // Send to Formspree
  let formData = new FormData();
  formData.append("student_id", id);
  formData.append("submitted_at", new Date().toLocaleString());

  fetch("https://formspree.io/f/xzzekvlr", {
    method: "POST",
    body: formData
  })
  .then(response => {
    if (response.ok) {
      // Record successful submission timestamp
      setLastSubmitTime(id);
      // Redirect after successful submission
      window.location.href = "https://AmineJalloh-io.github.io/student_daily_presence/?student_id=" + id;
    } else {
      errorMsg.innerText = `Submission failed (status ${response.status}). Try again.`;
      errorMsg.style.color = "red";
    }
  })
  .catch(error => {
    errorMsg.innerText = "Network error: " + error.message;
    errorMsg.style.color = "red";
  });
}
</script>

</body>
</html>
